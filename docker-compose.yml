version: '3.8'

# 로컬 개발용 PostgreSQL 만 띄웁니다.
# 백엔드·프론트엔드는 Dockerfile 이 없으므로 네이티브로 실행합니다(README 참고).
# docker 없이 Windows용 PostgreSQL 을 설치해 써도 동일합니다.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: easit
      POSTGRES_PASSWORD: easit1234
      POSTGRES_DB: easit
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
